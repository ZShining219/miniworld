name: miniworld-agent

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniworld
      POSTGRES_USER: miniworld
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miniworld-local-only}
    volumes:
      - miniworld-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniworld -d miniworld"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-environment
      DATABASE_URL: postgresql://miniworld:${POSTGRES_PASSWORD:-miniworld-local-only}@db:5432/miniworld
      FASTAPI_ENV: production
      FRONTEND_HOST: http://127.0.0.1:5173
      EXECUTION_MODE: ${EXECUTION_MODE:-demo}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MODEL_PROVIDER_MODE: ${MODEL_PROVIDER_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      ALLOW_LIVE_JOB_SEARCH: ${ALLOW_LIVE_JOB_SEARCH:-false}
      LIVE_JOB_SOURCE: ${LIVE_JOB_SOURCE:-lever}
      LEVER_SITES: ${LEVER_SITES:-binance}
      LEVER_TIMEOUT_SECONDS: ${LEVER_TIMEOUT_SECONDS:-15}
      LANGGRAPH_CHECKPOINT_MODE: postgres
      SCHEDULER_ENABLED: "false"
      UPLOAD_DIR: /data/uploads
      RADAR_MAP_DIR: /data/radar-maps
    volumes:
      - miniworld-uploads:/data/uploads
      - ./runtime-data/maps:/data/radar-maps:ro
    ports:
      - "127.0.0.1:8000:8000"
    command: ["bash", "-c", "bash scripts/prestart.sh && fastapi run app/main.py --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *backend-environment
      SCHEDULER_ENABLED: "true"
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-5}
    volumes:
      - miniworld-uploads:/data/uploads
    command: ["python", "-m", "app.worker"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:8000/api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"

volumes:
  miniworld-db:
  miniworld-uploads:
